<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verificador de Similaridade</title>
    <link rel="icon" type="image/png" href="/assets/favicon.ico" />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header>
      <h1>Verificador de Similaridade</h1>
    </header>
    <main>
      <section class="inputs">
        <div class="input-block">
          <label for="original">Texto original</label>
          <textarea id="original" placeholder="Cole aqui o texto original"></textarea>
        </div>
        <div class="input-block">
          <label for="similar">Texto a comparar</label>
          <textarea id="similar" placeholder="Cole aqui o texto similar"></textarea>
        </div>
      </section>
      <section class="results">
        <div class="metrics" id="metrics"></div>
        <div class="preview">
          <h3>Trechos similares (sobre o texto a comparar)</h3>
          <div id="highlighted" class="highlighted"></div>
          <div class="legend">
            <span class="chip exact">exato</span>
            <span class="chip high">alto</span>
            <span class="chip medium">médio</span>
            <span class="chip low">baixo</span>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <small>Feito com Bun + TypeScript</small>
    </footer>
    <script type="module" src="/assets/main.js"></script>
  </body>
  </html>
